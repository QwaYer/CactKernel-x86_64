# Meson cross file for the Cact x86-64 freestanding kernel.
#
#   meson setup build-meson --cross-file cross/x86_64-cact-clang.ini
#
# clang targets x86_64-pc-linux-gnu on this host, so "-m64" is all that is left
# to ask for -- but the kernel is really bare metal: no libc and no compiler
# driver are involved, the objects are linked by ld against linker.ld.
#
# system = 'none' marks the target as bare metal so Meson does not assume a
# hosted C library or add host-specific default flags.

[binaries]
c = 'clang'
ar = 'ar'
strip = 'strip'
objcopy = 'objcopy'

[built-in options]
c_args = ['-m64']

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

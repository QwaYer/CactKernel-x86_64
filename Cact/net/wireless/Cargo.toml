[package]
name = "cact80211"
version = "0.1.0"
edition = "2021"

# An rlib, like every other kernel Rust crate: the single `staticlib` is the
# link crate `cact_kernel`, which depends on this one.  The `#[no_mangle]`
# entry points (`cact80211_register` …) are re-exported by `kernel_abi`.
[lib]
name = "cact80211"
crate-type = ["lib"]

[dependencies]
cact_net = { path = "../rust_net" }
cact_sync = { path = "../../kernel/sync" }
# The graph's one `unsafe` crate: the C/scheduler/devfs surface and the
# raw-pointer helpers live there, so this crate can forbid `unsafe_code`.
kernel_rust = { path = "../../kernel/kernel_rust" }

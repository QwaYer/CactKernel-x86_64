[package]
name = "cact_drm"
version = "0.1.0"
edition = "2021"

[dependencies]
cact_mm = { path = "../../../../kernel/memory/rust_mm" }
# The graph's one `unsafe` crate: the KMS half reaches the kernel's spinlocks,
# user-copy helpers and raw-pointer plumbing through here.
kernel_rust = { path = "../../../../kernel/kernel_rust" }

[lib]
crate-type = ["lib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true

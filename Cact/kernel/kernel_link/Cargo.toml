[package]
name    = "cact_kernel"
version = "0.1.0"
edition = "2021"

# The kernel's single Rust archive.  Every kernel Rust crate is an rlib, so
# they call each other with plain `use`; this crate depends on all of them
# (including the safe kernel-interface crate `kernel_rust`) and is the one
# archive meson links into kernel.bin, which is what keeps every symbol (and
# every `#[no_mangle]` C-ABI entry point) present exactly once in the image.
[lib]
name       = "cact_kernel"
crate-type = ["staticlib"]

[dependencies]
kernel_rust   = { path = "../kernel_rust" }
cact_mm       = { path = "../memory/rust_mm" }
cact_hv       = { path = "../hypervisor/rust_hv" }
sched         = { path = "../proc/sched" }
cact_drm      = { path = "../../drivers/gpu/drm/rust_drm" }
cact_net      = { path = "../../net/rust_net" }
cact80211     = { path = "../../net/wireless" }
cact_vfs      = { path = "../../fs/rust_vfs" }
cact_hmac_ffi = { path = "../../crypto/hmac_ffi" }

[profile.release]
panic           = "abort"
opt-level       = 2
lto             = true
codegen-units   = 1
overflow-checks = true
debug           = false

[profile.dev]
panic           = "abort"
overflow-checks = true

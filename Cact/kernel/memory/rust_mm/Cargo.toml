[package]
name = "cact_mm"
version = "0.1.0"
edition = "2021"

[dependencies]
cact_sync = { path = "../../sync" }
kernel_rust = { path = "../../kernel_rust" }

[lib]
crate-type = ["lib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
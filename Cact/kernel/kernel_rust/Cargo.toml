[package]
name    = "kernel_rust"
version = "0.1.0"
edition = "2021"

# The kernel's safe Rust <-> C interface crate: the one Rust crate allowed to
# contain `unsafe`.  It is an rlib (a leaf, no intra-graph deps) that every
# other kernel Rust crate depends on, so the `unsafe` of the graph lives here
# and nowhere else.  The single staticlib is `Cact/kernel/kernel_link`.
[lib]
name       = "kernel_rust"
crate-type = ["rlib"]

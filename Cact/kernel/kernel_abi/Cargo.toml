[package]
name    = "kernel_abi"
version = "0.1.0"
edition = "2021"

# The kernel's exported C ABI: all `#[no_mangle]` entry points C calls into
# Rust, as thin thunks onto the logic crates' safe functions.  An rlib, pulled
# into kernel.bin by `Cact/kernel/kernel_link`.
[lib]
crate-type = ["lib"]

[dependencies]
cact_hv   = { path = "../hypervisor/rust_hv" }
cact_net  = { path = "../../net/rust_net" }
cact_sync = { path = "../sync" }
cact80211 = { path = "../../net/wireless" }
cact_crypto = { path = "../../crypto" }
cact_drm = { path = "../../drivers/gpu/drm/rust_drm" }

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

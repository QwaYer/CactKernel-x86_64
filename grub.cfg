set timeout=0
set default=0

menuentry "Cact Kernel" {
    insmod all_video
    insmod vbe
    insmod vga
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=auto
    multiboot2 /boot/kernel.bin
    module2   /boot/localbinrepo.img localbinrepo
    module2   /boot/FIRMREPO_ISO_PLACEHOLDER firmrepo
    module2   /boot/NETDRVREPO_ISO_PLACEHOLDER netdrvrepo
    boot
}
